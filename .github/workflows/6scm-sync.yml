name: 6SCM Mirror Check

on:
  push:
    paths:
      - '.machine_readable/**'
  pull_request:
    paths:
      - '.machine_readable/**'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Check 6scm mirrors
        run: bash scripts/check-6scm.sh
