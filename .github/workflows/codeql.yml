# SPDX-License-Identifier: MPL-2.0
name: CodeQL Security Analysis

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 1 * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze-js:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: metadatastician/standards/.github/workflows/codeql-reusable.yml@1ded685afb366dededa9f372f82fb58cd45f3c7b
    with:
      language: javascript-typescript
