# SPDX-License-Identifier: MPL-2.0
name: OSSF Scorecard

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  scorecard:
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    uses: hyperpolymath/standards/.github/workflows/scorecard-reusable.yml@1ded685afb366dededa9f372f82fb58cd45f3c7b
    secrets: inherit
